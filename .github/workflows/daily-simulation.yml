name: Daily TorsionLab simulation

on:
  schedule:
    # Every half hour. A timezone is unnecessary because :00 and :30 are the
    # same local clock minutes in every timezone.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Lets this workflow write the cumulative dataset to the separate data branch.
permissions:
  contents: write

jobs:
  simulate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the simulation source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # GitHub-hosted runners are temporary. Restore the previous CSV before
      # running the script so the new row is appended to the existing dataset.
      - name: Restore the previous dataset
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data:refs/remotes/origin/data
            git show origin/data:simulation_records.csv > simulation_records.csv
          fi

      - name: Generate and publish the daily observation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      # Store only the cumulative dataset on a dedicated branch. The video is
      # intentionally not committed, because Telegram is the publication target.
      - name: Append the observation to the data branch
        run: |
          records_path="$RUNNER_TEMP/simulation_records.csv"
          cp simulation_records.csv "$records_path"
          git config user.name "torsionlab-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data:refs/remotes/origin/data
            git switch --track -c data origin/data
          else
            git switch --orphan data
            # An orphan branch has no tracked files, so this may legitimately
            # have nothing to remove on the first run.
            git rm -rf . || true
          fi

          cp "$records_path" simulation_records.csv
          git add simulation_records.csv
          git commit -m "Record daily simulation $(date -u +%F)"
          git push origin HEAD:data
